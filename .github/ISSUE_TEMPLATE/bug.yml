name: Bug report
description: 报告一个可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。请尽可能提供完整的复现信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚描述实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出可以稳定复现问题的步骤。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Nexum 版本或 commit、相关组件。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请移除敏感信息后粘贴相关日志。
